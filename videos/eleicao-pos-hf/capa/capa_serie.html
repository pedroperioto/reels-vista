<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IB;src:url(../../../lib/fonts/InterBlack.otf)}@font-face{font-family:IS;src:url(../../../lib/fonts/InterSemi.otf)}
@font-face{font-family:SI;src:url(../../../lib/fonts/Instr.ttf)}@font-face{font-family:MO;src:url(../../../lib/fonts/Mono.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
#c{position:relative;width:1080px;height:1920px;background:radial-gradient(900px 700px at 540px 560px,#FFFFFF,#F2EEE6 70%);color:#0B1F3A}
#tag{position:absolute;left:0;right:0;top:300px;text-align:center;font:30px MO;letter-spacing:8px;color:#B8955A}
#duo{position:absolute;left:0;right:0;top:370px;display:flex;justify-content:center;align-items:flex-start}
.p{display:flex;flex-direction:column;align-items:center;width:400px}
canvas{width:330px;height:330px;border-radius:50%;border:8px solid #fff;box-shadow:0 22px 44px rgba(11,31,58,.25)}
.pc{margin-top:18px;font:64px IB;letter-spacing:-2px;line-height:1}.nm{margin-top:8px;font:24px MO;letter-spacing:6px;color:#6B7280}
.win .pc{color:#0B1F3A}.lose .pc{color:#9AA3B2}
.badge{position:absolute;top:262px;padding:8px 18px;border-radius:999px;background:#0B1F3A;color:#F3DDA8;font:24px MO;letter-spacing:3px;box-shadow:0 10px 20px rgba(11,31,58,.3)}
#vs{width:0;position:relative;z-index:2;top:165px}
#vs span{position:absolute;left:-58px;top:-58px;width:116px;height:116px;border-radius:50%;background:#0B1F3A;color:#F3DDA8;font:64px IB;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(11,31,58,.35);border:6px solid #fff}
#h{position:absolute;left:0;right:0;top:870px;text-align:center}
#h1{font:96px IB;letter-spacing:-4px;line-height:1.02}
#h2{font:120px SI;line-height:1;color:#B8955A;letter-spacing:-2px;margin-top:2px}
#split{position:absolute;left:84px;right:84px;top:1275px;height:350px;border-radius:44px;overflow:hidden;box-shadow:0 28px 54px rgba(11,31,58,.28)}
#y{position:absolute;inset:0;background:linear-gradient(160deg,#F7CF48,#F1BC1E);clip-path:polygon(0 0,100% 0,100% 32%,0 68%)}
#n{position:absolute;inset:0;background:radial-gradient(500px 380px at 640px 420px,#1C4277,#0B1F3A 72%);clip-path:polygon(0 68.6%,100% 32.6%,100% 100%,0 100%)}
.lab{position:absolute;font:24px MO;letter-spacing:10px}.big{position:absolute;font:92px IB;letter-spacing:-3px;line-height:1}
#l1{left:50px;top:40px;color:#1A1A1E}#b1{left:44px;top:70px;color:#1A1A1E}
#l2{right:50px;top:204px;color:#E2C27F}#b2{right:44px;top:234px;color:#fff}
#q{position:absolute;left:50%;top:57%;transform:translate(-50%,-50%) rotate(-12deg);background:#fff;border-radius:999px;padding:16px 46px;box-shadow:0 20px 40px rgba(4,12,26,.35);white-space:nowrap;font:52px IB;color:#0B1F3A}
#q i{font:62px SI;font-style:normal;color:#B8955A}
</style></head><body><div id="c">
<div id="tag">PARTE 2 · O RESULTADO</div>
<div id="duo">
 <div class="p win"><canvas id="a" width="660" height="660"></canvas><div class="pc">51,79%</div><div class="nm">LULA · REELEITO</div></div>
 <div id="vs"><span>×</span></div>
 <div class="p lose"><canvas id="b" width="660" height="660"></canvas><div class="pc">48,21%</div><div class="nm">FLÁVIO</div></div>
</div>
<div id="h"><div id="h1">O DÓLAR DISPAROU.<br>A BOLSA TRAVOU.</div><div id="h2">e o seu apê?</div></div>
<div id="split"><div id="y"></div><div id="n"></div>
 <div class="lab" id="l1">TIME</div><div class="big" id="b1">COMPRA</div>
 <div class="lab" id="l2">TIME</div><div class="big" id="b2">ESPERA</div>
 <div id="q">E agora, qual é o seu <i>time?</i></div></div>
</div><script>
const FOC={lula:[0.57,0.5,1.45],flavio:[0.52,0.6,1.45]};
window.done=Promise.all([['a','lula'],['b','flavio']].map(([id,k])=>new Promise(r=>{const im=new Image(); im.onload=()=>{const c=document.getElementById(id),g=c.getContext('2d'),[fx,fy,z]=FOC[k];
  const s=Math.min(im.width,im.height)/z, sx=Math.min(Math.max(fx*im.width-s/2,0),im.width-s), sy=Math.min(Math.max(fy*im.height-s/2,0),im.height-s);
  g.drawImage(im,sx,sy,s,s,0,0,660,660); r();}; im.src='../../eleicao-2026-v13/fotos/'+k+'.jpg';})));
</script></body></html>

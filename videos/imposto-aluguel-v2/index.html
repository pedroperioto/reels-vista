<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../lib/fonts.css">
<style>html,body{margin:0;background:#000} canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../../lib/engine.js"></script><script src="helpers.js"></script><script src="pecas.js"></script><script src="voz/tempos.js"></script><script src="final.js"></script>
<script>
(async () => {
  for (const f of ['InterBlack','InterSemi','InterMed','SerifIt','Instr','Mono']) await document.fonts.load(`80px ${f}`);
  await ASSETS; const cv = document.getElementById('c');
  window.frame = async (t) => { await clipPrep(t); render(cv, t); return cv.toDataURL('image/jpeg', 0.93); };
  window.DUR = DUR; window.TIMING_ = TIMING; window.ready = true;
})();
</script></body></html>
